appId: com.novelforge.app
productName: NovelForge
copyright: Copyright © 2026 NovelForge

directories:
  output: dist-electron

publish:
  provider: github
  owner: ruiworm
  repo: OpenFic
  releaseType: release

electronLanguages:
  - en-US
  - zh-CN

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../frontend/dist
    to: frontend-dist
    filter:
      - "**/*"
  - from: ../backend/dist
    to: backend-dist
    filter:
      - "*.whl"
  - from: resources/app-update.yml
    to: app-update.yml

win:
  icon: resources/icons/icon.ico
  artifactName: NovelForge-${version}-win-${arch}.${ext}
  target:
    - nsis
    - zip

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  artifactName: NovelForge-${version}-win-${arch}-setup.${ext}

mac:
  icon: resources/icons/512x512.png
  artifactName: NovelForge-${version}-mac-${arch}.${ext}
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  identity: null

linux:
  icon: resources/icons
  artifactName: NovelForge-${version}-linux-${arch}.${ext}
  synopsis: An AI-native writing tool for fiction authors
  description: NovelForge is an AI-native, cross-platform writing tool built for fiction authors.
  maintainer: NovelForge
  vendor: NovelForge
  target:
    - AppImage
    - tar.gz
  category: Utility
